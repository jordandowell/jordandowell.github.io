<article class="research-card"><p class="number">{{ printf "%02d" .Weight }} / Research theme</p><h3><a href="{{ .RelPermalink }}">{{ .Params.short_title | default .Title }}</a></h3>{{ $page := . }}{{ with .Resources.GetMatch "featured*" }}{{ $img := .Resize "800x webp q85" }}<a class="research-card-image" href="{{ $page.RelPermalink }}" aria-label="Explore {{ $page.Params.short_title | default $page.Title }}"><img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $page.Params.image.alt | default (printf "Research illustration: %s" $page.Title) }}" loading="lazy"></a>{{ end }}<p>{{ .Params.summary }}</p><a class="text-link" href="{{ .RelPermalink }}" aria-label="Read about {{ .Params.short_title | default .Title }}">Explore theme <span aria-hidden="true">→</span></a></article>
