<div class="photo-grid">{{ range . }}{{ $photo := . }}{{ with resources.Get .src }}{{ $thumb := .Resize "800x webp q82" }}<figure><a href="{{ .RelPermalink }}" aria-label="View full photo: {{ $photo.alt }}"><img src="{{ $thumb.RelPermalink }}" width="{{ $thumb.Width }}" height="{{ $thumb.Height }}" alt="{{ $photo.alt }}" loading="lazy" decoding="async"></a><figcaption>{{ $photo.caption }}</figcaption></figure>{{ end }}{{ end }}</div>
