{{ $page := . }}{{ with .Resources.GetMatch "featured*" }}{{ $img := .Resize "1400x webp q90" }}<figure class="research-figure research-lead-image"><a href="{{ .RelPermalink }}" aria-label="View full research image: {{ $page.Params.short_title | default $page.Title }}"><img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $page.Params.image.alt | default (printf "Research illustration: %s" $page.Title) }}"></a></figure>{{ end }}
