{{ with .Params.figure }}{{ $figure := . }}{{ with $.Resources.GetMatch .file }}{{ $img := .Resize "1380x webp q90" }}<figure class="paper-figure"><a href="{{ .RelPermalink }}" aria-label="Open full-size scientific figure"><img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $figure.alt }}" loading="lazy"></a><figcaption>{{ $figure.caption }}<br>Reproduced without alteration from <a href="{{ $figure.source }}">{{ $figure.credit }}</a>, licensed <a href="{{ $figure.license_url }}">{{ $figure.license }}</a>. <a href="{{ .RelPermalink }}">View full size</a>.</figcaption></figure>{{ end }}{{ end }}
